    - ~trainer.params.strategy
    - trainer.params.max_epochs=5
    - trainer.params.precision=32
    - agent.config.ckpt_path=ch3_df/p1_center
    - agent.checkpoint_path=/home/ws/navsim_workspace/GTRS_official/data/models/gtrs_dp_model.ckpt

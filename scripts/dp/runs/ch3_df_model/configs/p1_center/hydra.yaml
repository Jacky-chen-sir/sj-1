    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ws/navsim_workspace/exp/ch3_df/p1_center/2026.10.26.05.13.51
    choices:
      agent: gtrs_diffusion_policy
      worker: ray_distributed_no_torch
      train_test_split: navtrain
      train_test_split/scene_filter: navtrain
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default

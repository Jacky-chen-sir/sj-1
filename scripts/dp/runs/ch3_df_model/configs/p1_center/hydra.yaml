    - force_cache_computation=false
  job:
    name: run_training_dense
    chdir: false
    override_dirname: ++agent.config.bev_loss_weight=1.0,++agent.config.comfort_div_target=1.0,++agent.config.fm_center_p=1.0,++agent.config.fm_center_steps=4,++agent.config.fm_center_warmup_steps=2000,++agent.config.fm_center_weight=0.5,++agent.config.fm_clip_sample=true,++agent.config.fm_kin_weight=0.5,++agent.config.fm_lattice_k_set=[2,3,4,5,8,10,20],++agent.config.fm_lattice_t_prob=0.5,++agent.config.fm_num_inference_steps=20,++agent.config.fm_sc_max_steps=4,++agent.config.fm_sc_warmup_steps=2000,++agent.config.fm_self_conditioning=true,++agent.config.fm_self_consistency_p=0.5,++agent.config.fm_traj_aux_head_weight=1.0,++agent.config.fm_traj_aux_pos_weight=1.0,++agent.config.fm_traj_aux_weight=0.5,++agent.config.freeze_except_traj_head=false,++agent.config.guidance_every_n=1,++agent.config.guidance_samples=2,++agent.config.guidance_t_floor=0.1,++agent.config.guidance_t_min=0.5,++agent.config.guidance_warmup_steps=2000,++agent.config.lambda_comfort_div=0,++agent.config.lambda_safe_feas=0,++agent.config.lambda_score=0,++agent.config.lr_mult_backbone=0.1,++agent.config.reinit_traj_head=true,++agent.config.safe_feas_margin=0.5,++agent.config.score_temperature=1.0,++agent.config.scorer_allow_partial_load=false,++agent.config.scorer_ckpt='',++agent.config.scorer_guidance=false,++agent.config.scorer_vocab_path='/home/ws/navsim_workspace/GTRS_official/traj_final/test_8192_kmeans.npy',++agent.config.use_flow_matching=true,++agent.config.vov_ckpt=/home/ws/navsim_workspace/dataset/models/dd3d_det_final.pth,++dataloader.params.num_workers=4,++dataloader.params.persistent_workers=true,++dataloader.params.pin_memory=true,++trainer.params.accelerator=gpu,++trainer.params.devices=3,agent.checkpoint_path=/home/ws/navsim_workspace/GTRS_official/data/models/gtrs_dp_model.ckpt,agent.config.ckpt_path=ch3_df/p1_center,agent.lr=0.0001,agent=gtrs_diffusion_policy,cache_path=null,dataloader.params.batch_size=8,experiment_name=ch3_df/p1_center,force_cache_computation=false,train_test_spl
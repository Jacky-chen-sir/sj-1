# OPD 蒸馏学生（ResNet34）；教师=冻结 ViT-L（87.1）离线打分。
# 与 gtrs_aug_drivesuprim_r34.yaml 同一基座，只加 opd: 段并关掉在线软标签教师。
# opd: 块必须写全 _target_，否则 CLI 的 ++agent.config.opd.* 会把 opd 变成普通 dict、
# 之后 config.opd.tau 属性访问必崩（sync_drivesuprim_config_aliases 里有强制 coercion保护）。
_target_: navsim.agents.gtrs_aug.gtrs_aug_agent.GTRSAugAgent
_convert_: 'all'
metrics:
  - no_at_fault_collisions
  - drivable_area_compliance
  - time_to_collision_within_bound
  - ego_progress
  - driving_direction_compliance
  - lane_keeping
  - traffic_light_compliance
  - history_comfort

config:
  _target_: navsim.agents.gtrs_aug.hydra_config_aug.HydraConfigAug
  _convert_: 'all'
  vocab_path: ${oc.env:NAVSIM_DEVKIT_ROOT}/traj_final/test_8192_kmeans.npy
  ckpt_path: opd_r34_student_ckpt
  vocab_size: 8192
  lidar_seq_len: 4
  sigma: 0.5
  trajectory_imi_weight: 1.0
  progress_weight: 2.0
  normalize_vocab_pos: True
  vadv2_head_nlayers: 3

  camera_width: 2048
  camera_height: 512
  img_vert_anchors: 16
  img_horz_anchors: 64

  backbone_type: 'resnet34'
  vov_ckpt: ${oc.env:OPENSCENE_DATA_ROOT}/models/dd3d_det_final.pth
  vit_ckpt: ${oc.env:NAVSIM_EXP_ROOT}/models/da_vitl16.pth
  lr_mult_backbone: 1.0

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.1

  training: True
  only_ori_input: false
  student_rotation_ensemble: 3

  ego_perturb:
    _target_: navsim.agents.gtrs_aug.hydra_config_aug.EgoPerturbConfig
    _convert_: 'all'
    mode: load_from_offline
    ensemble_aug: false
    offline_aug_file: ${oc.env:NAVSIM_TRAJPDM_ROOT}/random_aug/rot_30-trans_0-va_0-p_0.5-ensemble.json
    n_student_rotation_ensemble: 3
    offline_aug_angle_boundary: 30.0
    rotation:
      _target_: navsim.agents.gtrs_aug.hydra_config_aug.RotationConfig
      enable: true
      fixed_angle: 0.0
      offline_aug_angle_boundary: 30
      change_camera: false
      crop_from_panoramic: true
    va:
      _target_: navsim.agents.gtrs_aug.hydra_config_aug.VAConfig
      enable: false
      offline_aug_boundary: 0.0

  camera_problem:
    _target_: navsim.agents.gtrs_aug.hydra_config_aug.CameraProblemConfig
    shutdown_enable: false
    shutdown_mode: 1
    shutdown_probability: 0.0
    noise_enable: false
    noise_percentage: 0.0
    gaussian_enable: false
    weather_enable: false

  ori_vocab_pdm_score_full_path: ${oc.env:NAVSIM_TRAJPDM_ROOT}/ori/vocab_score_8192_navtrain_final/navtrain.pkl
  aug_vocab_pdm_score_dir: ${oc.env:NAVSIM_TRAJPDM_ROOT}/random_aug/rot_30-p_0.5-ensemble/vocab_score_8192_navtrain_final/split_pickles
  weakly_supervised_imi_learning: false
  pdm_close_traj_for_augmented_gt: false
  traj_smoothing: false
  only_imi_learning: false

  soft_label_traj: 'first'
  soft_label_imi_diff_thresh: 1.0
  soft_label_score_diff_thresh: 0.15
  use_rotation_loss: false
  use_mask_loss: false

  refinement:
    _target_: navsim.agents.gtrs_aug.hydra_config_aug.RefinementConfig
    use_multi_stage: true
    refinement_approach: transformer_decoder
    num_refinement_stage: 1
    stage_layers: "3"
    topks: "256"
    use_mid_output: true
    use_offset_refinement: true
    use_offset_refinement_v2: false
    use_separate_stage_heads: true
    use_imi_learning_in_refinement: true

  inference:
    _target_: navsim.agents.gtrs_aug.hydra_config_aug.InferConfig
    model: student            # OPD 离线蒸馏没有 in-process teacher；sync 里也会强制 student
    use_aug: true
    use_first_stage_traj_in_infer: false
    save_pickle: false

  lab:
    _target_: navsim.agents.gtrs_aug.hydra_config_aug.LabConfig
    check_top_k_traj: false
    num_top_k: 64
    test_full_vocab_pdm_score_path: "aaa"
    use_first_stage_traj_in_infer: false
    change_loss_weight: false
    use_imi_learning_in_refinement: true
    adjust_refinement_loss_weight: false
    adjust_refinement_score_weight: false
    ban_soft_label_loss: true
    optimize_prev_frame_traj_for_ec: false
    refinement_metrics: 'all'
    use_higher_res_feat_in_refinement: false
    use_cosine_ema_scheduler: false
    ema_momentum_start: 0.99
    update_buffer_in_ema: false
    save_pickle: false

  opd:
    _target_: navsim.agents.gtrs_aug.hydra_config_aug.OPDConfig
    enable: true
    teacher_mode: offline
    teacher_score_dir: ${oc.env:OPD_TEACHER_SCORE_DIR,${oc.env:NAVSIM_TRAJPDM_ROOT}/opd/teacher/vit_l/8192_cache_ori}
    teacher_onpolicy_score_dir: ${oc.env:OPD_TEACHER_ONPOLICY_SCORE_DIR,${oc.env:NAVSIM_TRAJPDM_ROOT}/opd/teacher/vit_l/8192_cache_onpolicy}
    tau_imi: 2.0
    tau_head: 2.0
    tau_list: 2.0
    lambda_imi: 1.0
    lambda_head: 1.0
    lambda_refine: 1.0
    lambda_recall: 0.5
    topk_refine: 256
    topk_recall: 32
    safe_fused_score: true
    # 必须与缓存时的 OPD_STORE_HEADS 一致（cache_teacher.sh 默认 1）。
    # 为 false 时 lambda_head 那一路被自动置零。
    store_heads: true
    on_policy_rounds: 0
    on_policy_weight: 0.5
    # on-policy 教师缓存配对的学生视图下标（0=原视图，1..=旋转视图）
    on_policy_view_idx: 1

checkpoint_path: null
lr: 1e-4
